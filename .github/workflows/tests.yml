name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Installs spacy (the only hard dependency) plus pytest. The optional
      # `model` and `train` extras pull torch and transformers; System B's
      # tests skip themselves when the weights are absent, so they are not
      # installed here.
      - name: Install
        run: pip install -e '.[dev]'

      # caesura/rules.py loads this model for the parser-rule system.
      - name: Download the spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        run: pytest -q
