[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caesura"
version = "0.1.0"
description = "Phrase-break and emphasis prediction from syntax, on punctuation-free text"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oscar Dalton" }]
keywords = ["prosody", "phrase break", "tts", "front end", "text normalisation"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "spacy>=3.7",
]

[project.optional-dependencies]
model = [
  "torch>=2.0",
  "transformers>=4.40",
]
train = [
  "torch>=2.0",
  "transformers>=4.40",
  "pyarrow>=14",
]
dev = [
  "pytest>=7",
]

[project.scripts]
caesura = "caesura.__main__:main"

[project.urls]
Homepage = "https://github.com/daltonoscar0/caesura"

[tool.setuptools.packages.find]
include = ["caesura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
